[project]
# "lockstep" was already taken on PyPI, same story as every sibling in
# this portfolio. The installed command stays the short name --
# python-dateutil installs `dateutil`, this installs `lockstep`.
name = "lockstep-evidence"
version = "0.1.1"
description = "Does what's actually installed match the lockfile? Runtime dependency drift, not just a commit-time CVE scan."
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["dependencies", "drift", "supply-chain", "evidence", "reliability", "pip"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
# importlib.metadata (stdlib) reads what's installed. `packaging` is the
# reference PEP 440 implementation pip itself vendors: "1.0" == "1.0.0"
# is not something a string compare can answer.
dependencies = ["packaging>=22"]

urls.Homepage = "https://github.com/MaXiMo000/lockstep"
urls.Source = "https://github.com/MaXiMo000/lockstep"
urls.Issues = "https://github.com/MaXiMo000/lockstep/issues"
urls.Changelog = "https://github.com/MaXiMo000/lockstep/releases"

[project.scripts]
lockstep = "lockstep.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lockstep*"]
